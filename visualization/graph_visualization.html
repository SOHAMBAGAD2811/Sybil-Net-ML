    <style>
        /* ── Theme overrides ─────────────────────────────────────── */
        body {
            background: #05070f !important;
            font-family: 'Space Grotesk', sans-serif !important;
            color: #e2e8f0 !important;
            margin: 0 !important;
            overflow: hidden !important;
        }

        /* Hide the pyvis toolbar / heading pyvis sometimes adds */
        h1, .vis-network-tooltip { display: none !important; }

        /* Make the canvas container fill the window */
        #mynetwork {
            width: 100vw !important;
            height: 100vh !important;
            border: none !important;
            background: #05070f !important;
        }

        /* ── Glassmorphism panel ─────────────────────────────────── */
        .sn-panel {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 288px;
            z-index: 999;
            background: rgba(13, 17, 32, 0.78);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(100, 180, 255, 0.13);
            border-radius: 16px;
            padding: 22px 22px 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.5);
            animation: snSlide .55s cubic-bezier(.16,1,.3,1) both;
        }
        @keyframes snSlide {
            from { transform: translateX(-40px); opacity: 0; }
            to   { transform: translateX(0);     opacity: 1; }
        }

        /* Eyebrow */
        .sn-eyebrow {
            font-size: .62rem;
            font-weight: 600;
            letter-spacing: .18em;
            text-transform: uppercase;
            color: #00d4ff;
            display: flex;
            align-items: center;
            gap: 7px;
        }
        .sn-eyebrow::before {
            content: '';
            display: inline-block;
            width: 16px; height: 2px;
            background: #00d4ff;
            border-radius: 2px;
        }

        /* Title */
        .sn-title {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -.02em;
            line-height: 1.1;
            background: linear-gradient(135deg, #00d4ff 0%, #a855f7 55%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-top: -4px;
        }
        .sn-sub {
            font-size: .77rem;
            color: #64748b;
            margin-top: -8px;
        }

        /* Stats grid */
        .sn-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .sn-stat {
            background: rgba(0,0,0,.32);
            border: 1px solid rgba(100,180,255,.1);
            border-radius: 10px;
            padding: 11px 13px;
            transition: border-color .25s;
        }
        .sn-stat:hover { border-color: rgba(0,212,255,.35); }
        .sn-stat-label {
            font-size: .6rem;
            font-weight: 600;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: #64748b;
            margin-bottom: 5px;
        }
        .sn-stat-value {
            font-size: 1.45rem;
            font-weight: 300;
            color: #fff;
            letter-spacing: -.02em;
        }
        .sn-stat-value.cyan   { color: #00d4ff; }
        .sn-stat-value.violet { color: #a855f7; }
        .sn-stat-value.red    { color: #ef4444; }

        /* Divider */
        .sn-divider {
            height: 1px;
            background: rgba(100,180,255,.09);
        }

        /* Legend */
        .sn-legend-title {
            font-size: .6rem;
            font-weight: 600;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: #64748b;
            margin-bottom: 8px;
        }
        .sn-legend {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .sn-legend-item {
            display: flex;
            align-items: center;
            gap: 9px;
            font-size: .78rem;
            color: #e2e8f0;
        }
        .sn-dot {
            width: 9px; height: 9px;
            border-radius: 50%;
            flex-shrink: 0;
            box-shadow: 0 0 5px currentColor;
        }

        /* ── Status pill ─────────────────────────────────────────── */
        .sn-status {
            position: fixed;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            background: rgba(13,17,32,.82);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(100,180,255,.12);
            border-radius: 100px;
            padding: 7px 18px;
            font-size: .7rem;
            color: #64748b;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            animation: snFadeUp .8s ease-out .4s both;
        }
        @keyframes snFadeUp {
            from { opacity: 0; transform: translateX(-50%) translateY(8px); }
            to   { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        .sn-pulse {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: #10b981;
            box-shadow: 0 0 6px #10b981;
            animation: snPulse 2s infinite;
        }
        @keyframes snPulse {
            0%,100% { opacity:1; } 50% { opacity:.25; }
        }

        /* ── Tooltip override ────────────────────────────────────── */
        div.vis-tooltip {
            background: rgba(13,17,32,.95) !important;
            border: 1px solid rgba(100,180,255,.25) !important;
            border-radius: 8px !important;
            color: #e2e8f0 !important;
            font-family: 'Space Grotesk', sans-serif !important;
            font-size: .78rem !important;
            padding: 9px 13px !important;
            box-shadow: 0 4px 24px rgba(0,0,0,.5) !important;
            backdrop-filter: blur(8px) !important;
        }
    </style>

</head>
